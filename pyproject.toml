[project]
name = "grc-workspace"
version = "0.1.0"
description = "Barebones GCC GRC workspace"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "itsdangerous",
    "jinja2",
    "python-multipart",
    "uvicorn",
]

[project.scripts]
grc = "grc_app.main:main"

[dependency-groups]
dev = ["httpx", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grc_app"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
